name: Release UnitTCMS Docker images

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic-version bump to apply to the latest stable release
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  API_IMAGE: ghcr.io/danielrondongarcia/unittcms
  WORKER_IMAGE: ghcr.io/danielrondongarcia/unittcms-automation-worker

jobs:
  publish:
    name: Build and publish release images
    runs-on: ubuntu-latest
    steps:
      - name: Check out release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release tag from manual bump
        if: github.event_name == 'workflow_dispatch'
        id: create_tag
        shell: bash
        env:
          BUMP_TYPE: ${{ inputs.bump_type }}
        run: |
          set -euo pipefail

          case "$BUMP_TYPE" in
            major|minor|patch)
              ;;
            *)
              echo "Unsupported bump_type '$BUMP_TYPE'. Expected major, minor, or patch." >&2
              exit 1
              ;;
          esac

          latest_stable="$({
            git tag --list
            printf '\n'
          } | sed -nE 's/^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/\1.\2.\3/p' | sort -V | tail -n 1)"
          if [[ -z "$latest_stable" ]]; then
            latest_stable="$(node -p "require('./package.json').version")"
            echo "No stable semantic tag found; using package.json version $latest_stable as the bump base."
          fi

          if [[ ! "$latest_stable" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Unable to use '$latest_stable' as the stable semantic-version bump base." >&2
            exit 1
          fi

          IFS=. read -r major minor patch <<< "$latest_stable"
          case "$BUMP_TYPE" in
            major)
              next_version="$((major + 1)).0.0"
              ;;
            minor)
              next_version="$major.$((minor + 1)).0"
              ;;
            patch)
              next_version="$major.$minor.$((patch + 1))"
              ;;
          esac

          release_tag="$next_version"
          if git show-ref --tags --verify --quiet "refs/tags/$release_tag"; then
            echo "Release tag '$release_tag' already exists locally; refusing to overwrite it." >&2
            exit 1
          fi

          if ! remote_tags="$(git ls-remote --refs --tags origin "refs/tags/$release_tag")"; then
            echo "Unable to verify whether release tag '$release_tag' already exists remotely." >&2
            exit 1
          fi
          if [[ -n "$remote_tags" ]]; then
            echo "Release tag '$release_tag' already exists remotely; refusing to overwrite it." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$release_tag" --message "Release $release_tag" HEAD
          git push origin "refs/tags/$release_tag"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Validate release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && steps.create_tag.outputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "push" && "$EVENT_NAME" != "workflow_dispatch" ]]; then
            echo "Unsupported release event '$EVENT_NAME'." >&2
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "Release tag must be a semantic version with an optional v prefix or prerelease suffix." >&2
            exit 1
          fi
          if ! git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            echo "The resolved release tag '$RELEASE_TAG' was not found in this repository." >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo 'stable=false' >> "$GITHUB_OUTPUT"
          else
            echo 'stable=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate API image metadata
        id: meta_api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.API_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: default
          push: true
          tags: ${{ steps.meta_api.outputs.tags }}
          labels: ${{ steps.meta_api.outputs.labels }}

      - name: Generate worker image metadata
        id: meta_worker
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.WORKER_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=latest,enable=${{ steps.release.outputs.stable }}
          labels: |
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ steps.release.outputs.revision }}

      - name: Build and push worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: automation-worker
          push: true
          tags: ${{ steps.meta_worker.outputs.tags }}
          labels: ${{ steps.meta_worker.outputs.labels }}

      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_TAG already exists; leaving it unchanged."
          else
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
